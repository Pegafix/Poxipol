<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotizador de Traslados</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6eb; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1218; --panel: #171b23; --text: #e6e9ef; --muted: #98a2b3; --line: #2a303b; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
    aside { overflow-y: auto; padding: 16px; background: var(--panel); border-right: 1px solid var(--line); }
    #mapa { height: 100%; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    h2 { font-size: 14px; margin: 18px 0 8px; }
    label { display: block; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
    input, select, button { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
    button { cursor: pointer; }
    button.primario { background: var(--accent); color: #fff; border: 0; font-weight: 600; margin-top: 12px; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .modos button.activo { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .puntos { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
    .puntos li { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
    .puntos button { width: auto; padding: 0 6px; }
    .ruta { border: 1px solid var(--line); border-left: 6px solid; border-radius: 8px; padding: 10px; margin: 8px 0; cursor: pointer; }
    .ruta.sel { outline: 2px solid var(--accent); }
    .ruta .precio { font-size: 20px; font-weight: 700; }
    .chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--line); margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td { padding: 3px 0; border-bottom: 1px solid var(--line); }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-size: 12px; }
    .aviso { background: #fef3c7; color: #78350f; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; }
    .error { background: #fee2e2; color: #7f1d1d; }
    @media (max-width: 800px) { .app { grid-template-columns: 1fr; grid-template-rows: 50vh auto; height: auto; } #mapa { height: 50vh; grid-row: 1; } aside { grid-row: 2; border: 0; } }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Cotizador de traslados</h1>
    <label>Vehículo</label>
    <select id="vehiculo"></select>

    <h2>Puntos (haz clic en el mapa)</h2>
    <div class="modos">
      <button data-modo="origen" class="activo">Origen</button>
      <button data-modo="parada">+ Parada</button>
      <button data-modo="destino">Destino</button>
    </div>
    <ul class="puntos" id="listaPuntos"></ul>

    <div class="fila">
      <div><label>Pasajeros totales</label><input id="pasajeros" type="number" min="1" value="4" /></div>
      <div><label>Tipo de viaje</label>
        <select id="tipoViaje"><option value="ida">Solo ida</option><option value="ida_vuelta">Ida y vuelta</option></select>
      </div>
    </div>
    <div class="fila">
      <div><label>Espera en destino (min)</label><input id="espera" type="number" min="0" value="0" /></div>
      <div><label>% retorno vacío (solo ida)</label><input id="retorno" type="number" min="0" max="100" value="0" /></div>
    </div>
    <div class="fila">
      <div><label>Margen de ganancia %</label><input id="margen" type="number" min="0" value="25" /></div>
      <div><label>Incluir IVA</label><select id="iva"><option value="false">No</option><option value="true">Sí</option></select></div>
    </div>
    <button class="primario" id="cotizar">Calcular rutas y tarifa</button>
    <div id="mensajes"></div>
    <div id="resultado"></div>
  </aside>
  <div id="mapa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORES = ['#2563eb', '#16a34a', '#ea580c', '#9333ea', '#db2777'];
const $ = (id) => document.getElementById(id);
const fmt = (n, moneda = 'CLP') => new Intl.NumberFormat('es-CL', { style: 'currency', currency: moneda, maximumFractionDigits: 0 }).format(n);

const mapa = L.map('mapa').setView([-33.45, -70.66], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(mapa);

const estado = { modo: 'origen', origen: null, destino: null, paradas: [], capas: [], datos: null, sel: null };
const marcadores = L.layerGroup().addTo(mapa);

document.querySelectorAll('.modos button').forEach((b) => b.onclick = () => {
  estado.modo = b.dataset.modo;
  document.querySelectorAll('.modos button').forEach((x) => x.classList.toggle('activo', x === b));
});

mapa.on('click', (e) => {
  const p = { lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6) };
  if (estado.modo === 'parada') {
    const pax = Number(prompt('¿Cuántos pasajeros bajan en esta parada?', '1'));
    if (!Number.isInteger(pax) || pax < 0) return;
    const nombre = prompt('Nombre de la parada', `Parada ${estado.paradas.length + 1}`) || `Parada ${estado.paradas.length + 1}`;
    estado.paradas.push({ ...p, nombre, pasajeros: pax });
  } else {
    estado[estado.modo] = { ...p, nombre: estado.modo === 'origen' ? 'Origen' : 'Destino' };
    if (estado.modo === 'origen') document.querySelector('[data-modo="destino"]').click();
  }
  pintarPuntos();
});

function pintarPuntos() {
  marcadores.clearLayers();
  const lista = [];
  const item = (txt, quitar) => lista.push(`<li><span>${txt}</span>${quitar ? `<button onclick="${quitar}">✕</button>` : ''}</li>`);
  if (estado.origen) { L.marker(estado.origen).bindTooltip('Origen').addTo(marcadores); item('🟢 Origen', 'estado.origen=null;pintarPuntos()'); }
  estado.paradas.forEach((p, i) => {
    L.circleMarker(p, { radius: 8, color: '#ea580c' }).bindTooltip(`${p.nombre} (bajan ${p.pasajeros})`).addTo(marcadores);
    item(`🟠 ${p.nombre} · bajan ${p.pasajeros}`, `estado.paradas.splice(${i},1);pintarPuntos()`);
  });
  if (estado.destino) { L.marker(estado.destino).bindTooltip('Destino').addTo(marcadores); item('🔴 Destino (bajan los restantes)', 'estado.destino=null;pintarPuntos()'); }
  $('listaPuntos').innerHTML = lista.join('') || '<li class="muted">Haz clic en el mapa para marcar el origen.</li>';
  const bajan = estado.paradas.reduce((s, p) => s + p.pasajeros, 0);
  if (!estado.destino && estado.paradas.length) $('pasajeros').value = bajan;
}

async function cargarVehiculos() {
  const lista = await (await fetch('/api/vehiculos')).json();
  $('vehiculo').innerHTML = lista.map((v) => `<option value="${v.id}">${v.marca} ${v.modelo} · ${v.capacidadPasajeros} pax · ${v.combustible}</option>`).join('');
}

$('cotizar').onclick = async () => {
  $('mensajes').innerHTML = '';
  const cuerpo = {
    vehiculo: $('vehiculo').value,
    origen: estado.origen,
    destino: estado.destino || undefined,
    paradas: estado.paradas,
    pasajeros: Number($('pasajeros').value),
    tipoViaje: $('tipoViaje').value,
    vuelta: { esperaMin: Number($('espera').value) },
    parametros: {
      porcentajeRetornoVacio: Number($('retorno').value),
      margenGananciaPct: Number($('margen').value),
      incluirIVA: $('iva').value === 'true',
    },
  };
  $('cotizar').disabled = true;
  $('cotizar').textContent = 'Calculando…';
  try {
    const res = await fetch('/api/cotizar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo) });
    const datos = await res.json();
    if (!res.ok) throw new Error(datos.error + (datos.detalles ? ' ' + JSON.stringify(datos.detalles) : ''));
    estado.datos = datos;
    datos.advertencias.forEach((a) => $('mensajes').insertAdjacentHTML('beforeend', `<div class="aviso">${a}</div>`));
    mostrarRutas(datos.recomendada);
  } catch (err) {
    $('mensajes').innerHTML = `<div class="aviso error">${err.message}</div>`;
  } finally {
    $('cotizar').disabled = false;
    $('cotizar').textContent = 'Calcular rutas y tarifa';
  }
};

function mostrarRutas(idSel) {
  const d = estado.datos;
  estado.capas.forEach((c) => c.remove());
  estado.capas = [];
  d.rutas.forEach((r, i) => {
    const sel = r.id === idSel;
    const capa = L.geoJSON(r.geometria, { style: { color: COLORES[i % COLORES.length], weight: sel ? 7 : 4, opacity: sel ? 0.95 : 0.45 } })
      .on('click', () => mostrarRutas(r.id)).addTo(mapa);
    if (sel) capa.bringToFront();
    estado.capas.push(capa);
  });
  const todas = L.featureGroup(estado.capas);
  if (!estado.sel) mapa.fitBounds(todas.getBounds(), { padding: [30, 30] });
  estado.sel = idSel;

  const tarjetas = d.rutas.map((r, i) => `
    <div class="ruta ${r.id === idSel ? 'sel' : ''}" style="border-left-color:${COLORES[i % COLORES.length]}" onclick="mostrarRutas(${r.id})">
      <div>${r.etiquetas.map((e) => `<span class="chip">${e.replace('_', ' ')}</span>`).join('')}</div>
      <strong>${r.nombre}</strong>
      <div class="muted">${r.distanciaKm} km · ${r.duracionMin} min · peajes ${fmt(r.tarifa.peajes.monto, d.moneda)}</div>
      <div class="precio">${fmt(r.tarifa.precioFinal, d.moneda)}</div>
      <div class="muted">Solo ida ${fmt(r.tarifas.ida.precioFinal, d.moneda)} · Ida y vuelta ${fmt(r.tarifas.idaVuelta.precioFinal, d.moneda)}</div>
    </div>`).join('');

  const r = d.rutas.find((x) => x.id === idSel);
  const t = r.tarifa;
  const filas = [
    ['Combustible', `${t.combustible.litros} L × ${fmt(t.combustible.precioLitro, d.moneda)}`, t.combustible.monto],
    ['Peajes', t.peajes.detalle.map((p) => p.nombre).join(', ') || '—', t.peajes.monto],
    ['Desgaste del vehículo', `${fmt(t.desgaste.porKm, d.moneda)}/km`, t.desgaste.monto],
    ['Conductor (tiempo)', `${t.tiempo.totalCobradoMin} min`, t.conductor.monto],
    ['Costos fijos (seguro, permiso)', '', t.costosFijos.monto],
    ['Imprevistos', `${t.imprevistos.porcentaje}%`, t.imprevistos.monto],
    ['<strong>Costo real (sin pérdida)</strong>', '', t.costoTotal],
    ['Ganancia', `${t.margen.porcentaje}%`, t.margen.monto],
    ['Recargo por paradas', `${t.recargoParadas.paradas} × ${fmt(t.recargoParadas.valorPorParada, d.moneda)}`, t.recargoParadas.monto],
    ['IVA', t.iva.incluido ? `${t.iva.porcentaje}%` : 'no incluido', t.iva.monto],
    ['<strong>Precio a cobrar</strong>', '', t.precioFinal],
    ['Por pasajero', `${d.pasajeros} pax`, t.precioPorPasajero],
  ];
  const desglose = r.desglosePasajeros.map((g) => `<tr><td>${g.nombre}<br><span class="muted">${g.pasajeros} pax · ${g.kmABordo} km a bordo</span></td><td>${fmt(g.montoPorPasajero, d.moneda)} c/u<br><span class="muted">${fmt(g.montoGrupo, d.moneda)} grupo</span></td></tr>`).join('');

  $('resultado').innerHTML = `
    <h2>Rutas (${d.tipoViaje === 'ida' ? 'solo ida' : 'ida y vuelta'})</h2>${tarjetas}
    <h2>Detalle: ${r.nombre}</h2>
    <table>${filas.map(([a, b, c]) => `<tr><td>${a}<br><span class="muted">${b}</span></td><td>${fmt(c, d.moneda)}</td></tr>`).join('')}</table>
    <p class="muted">Retorno vacío de referencia: ${r.retornoVacioReferencia.distanciaKm} km, cuesta ${fmt(r.retornoVacioReferencia.costo, d.moneda)}.</p>
    <h2>Cobro por pasajero según dónde baja</h2><table>${desglose}</table>`;
}

cargarVehiculos();
pintarPuntos();
</script>
</body>
</html>
