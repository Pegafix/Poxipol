<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brasa Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: columna fija con Brasa (el compañero) a la izquierda; la hoja de ruta fluye a la derecha. En móvil, Brasa arriba. */
:root {
  --bg: #0e1311;
  --surface: #151c19;
  --surface-2: #1c2521;
  --line: #2a3530;
  --ink: #e9eee9;
  --muted: #8d9b93;
  --ember: #ff8a3d;
  --ember-ink: #1b0d03;
  --ok: #43c98f;
  --over: #ff7b72;
  --code-bg: #0a0f0d;
  --code-ink: #cfe6da;
  --hole: #ffb37a;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.25);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef2ef; --surface: #ffffff; --surface-2: #f4f7f5; --line: #d8e0db; --ink: #14201a; --muted: #5d6c64;
    --ember: #e8661a; --ember-ink: #ffffff; --ok: #1f9c67; --over: #d2453b; --code-bg: #14201a; --code-ink: #dcefe4; --hole: #ffb37a;
    --shadow: 0 1px 2px rgba(20,32,26,.06), 0 8px 24px rgba(20,32,26,.06);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef2ef; --surface: #ffffff; --surface-2: #f4f7f5; --line: #d8e0db; --ink: #14201a; --muted: #5d6c64;
  --ember: #e8661a; --ember-ink: #ffffff; --ok: #1f9c67; --over: #d2453b; --code-bg: #14201a; --code-ink: #dcefe4; --hole: #ffb37a;
  --shadow: 0 1px 2px rgba(20,32,26,.06), 0 8px 24px rgba(20,32,26,.06);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-inline: 16px; padding-block: 0 40px; min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--ember); outline-offset: 2px; }
.muted { color: var(--muted); }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  max-width: 1240px; margin: 0 auto; padding-block: 12px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { font: 800 20px/1 var(--f-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--ember); box-shadow: 0 0 12px var(--ember); display: inline-block; }
.top-actions { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#sync, #loadstate { font-size: 12.5px; color: var(--muted); }
.select-wrap select {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 260px; font: inherit; font-size: 14px;
}

.btn {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px;
  transition: transform .12s ease, background .12s ease;
}
.btn:hover:not(:disabled) { background: var(--line); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ember); border-color: transparent; color: var(--ember-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--ember); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn.rec { background: var(--over); color: #fff; border-color: transparent; }
.upload { position: relative; overflow: hidden; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.link.danger { color: var(--over); }

.layout { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; padding-top: 22px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .topbar { position: static; } #flame { height: 170px; } }

/* ---------- Brasa ---------- */
.companion { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 14px; }
@media (max-width: 900px) { .companion { position: static; } }
.hearth { background: radial-gradient(120% 90% at 50% 100%, color-mix(in srgb, var(--ember) 16%, var(--surface)) 0%, var(--surface) 60%); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; box-shadow: var(--shadow); }
.hearth-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
#stage { font: 800 28px/1 var(--f-display); letter-spacing: -.02em; }
#level { font: 600 13px/1 var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#flame { display: block; width: 100%; height: 210px; cursor: pointer; }
.bubble { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; min-height: 44px; }
.bubble::before { content: ""; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; background: var(--surface-2); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.bubble.big { border-color: var(--ember); }
.bubble.pop { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
.xp { margin-top: 12px; }
.xp-track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
#xpbar { display: block; height: 100%; background: linear-gradient(90deg, #ffcf6b, var(--ember)); border-radius: 99px; transition: width .5s ease; }
.xp-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.trio div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.trio b { display: block; font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.trio span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.panel h3 { margin: 0 0 10px; font: 700 12px/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stat { display: grid; grid-template-columns: 74px 1fr 28px; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
.stat-bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.stat-bar i { display: block; height: 100%; border-radius: 99px; transition: width .5s ease; }
.stat-n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
#heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
#heat i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); max-width: 100%; }
#heat i.h1 { background: color-mix(in srgb, var(--ember) 30%, var(--surface-2)); }
#heat i.h2 { background: color-mix(in srgb, var(--ember) 55%, var(--surface-2)); }
#heat i.h3 { background: color-mix(in srgb, var(--ember) 80%, var(--surface-2)); }
#heat i.h4 { background: var(--ember); box-shadow: 0 0 6px var(--ember); }
.heat-cap { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.next-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.next-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.next-row span:not(.tag) { flex: 1; min-width: 0; }

/* ---------- Proyecto ---------- */
#main { min-width: 0; }
.proj-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--ember); font-weight: 700; }
.proj h1 { font: 800 clamp(26px, 4vw, 40px)/1.05 var(--f-display); letter-spacing: -.025em; margin: 6px 0 4px; text-wrap: balance; }
.proj-sub { color: var(--muted); margin: 0 0 14px; }
.kpis { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-bottom: 10px; }
.kpi b { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; display: block; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.progress { height: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); transition: width .5s ease; }

.vars { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; padding: 10px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.vars-l { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.var { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12.5px; border-radius: 6px; }
.var span { color: var(--hole); }
.var input { font: 13px var(--f-body); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 150px; max-width: 100%; }

.track { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 10px; }
.node {
  --k: 0; width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
  background: conic-gradient(var(--ember) calc(var(--k) * 360deg), var(--line) 0);
}
.node span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font: 700 13px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.node.is-done { background: var(--ok); }
.node.is-done span { background: var(--ok); color: var(--bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
.legend > span { display: inline-flex; align-items: center; gap: 4px; }

.tag {
  --tc: var(--muted); flex: none; font: 600 10.5px/1 var(--f-mono); letter-spacing: .06em; padding: 4px 6px; border-radius: 5px;
  color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tc) 40%, transparent);
}

.phases { display: grid; gap: 10px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; scroll-margin-top: 80px; }
.phase.open { box-shadow: var(--shadow); }
.ph-head { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: none; border: 0; padding: 14px 16px; }
.ph-num { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font: 800 15px/1 var(--f-display); }
.phase.done .ph-num { background: var(--ok); color: var(--bg); border-color: transparent; }
.ph-title { min-width: 0; }
.ph-title b { display: block; font: 700 17px/1.2 var(--f-display); letter-spacing: -.01em; }
.ph-title small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.ph-side { display: grid; justify-items: end; gap: 3px; }
.ph-est { font-size: 12px; color: var(--muted); white-space: nowrap; }
.ph-count { font: 700 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.phase.done .ph-count { color: var(--ok); }
@media (max-width: 520px) { .ph-head { grid-template-columns: auto minmax(0, 1fr); } .ph-side { grid-column: 2; justify-items: start; grid-auto-flow: column; gap: 10px; } }
.ph-body { padding: 0 16px 16px; display: grid; gap: 14px; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.field { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); }
.field h4 { margin: 0 0 4px; font: 700 11.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.field p { margin: 0; font-size: 13.5px; }
.field.f-claude h4 { color: #2fbf8f; }
.field.f-done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.field.f-done h4 { color: var(--ok); }

.tasks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tasks li { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); transition: background .2s ease; }
.tasks li:first-child { border-top: 0; }
.tasks li:hover { background: var(--surface-2); }
.t-text { flex: 1; min-width: 0; padding-top: 1px; }
.tasks li.on .t-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--ember); text-decoration-thickness: 2px; }
.check {
  flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); background: transparent; padding: 0; position: relative;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
.check:hover { border-color: var(--ember); }
.check:active { transform: scale(.9); }
.on > .check, .check[aria-checked="true"] { background: var(--ember); border-color: var(--ember); }
.on > .check::after, .check[aria-checked="true"]::after { content: ""; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px; border: solid var(--ember-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }

.gate { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; }
.gate-ok { color: var(--ok); font-weight: 600; }

.prompt { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 12px 14px; border-left: 3px solid #2fbf8f; }
.prompt-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.prompt-head > span:first-child { font: 600 11.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #2fbf8f; }
.prompt-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.prompt .btn { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); color: var(--code-ink); }
.prompt .btn:hover { background: rgba(255,255,255,.12); }
.prompt pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.6 var(--f-mono); }
.prompt mark { background: rgba(47,191,143,.18); color: #7fe3bd; border-radius: 3px; padding: 0 2px; }
.prompt mark.hole { background: rgba(255,179,122,.15); color: var(--hole); }
.prompt-vars { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.prompt .var input { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); color: var(--code-ink); }
.prompt-hint { margin-top: 8px; font-size: 12px; color: #8fb3a1; }

.ask { display: none; }
body.can-ask .ask { display: grid; gap: 6px; }
.ask label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.ask-row { display: flex; gap: 8px; align-items: flex-start; }
.ask textarea { flex: 1; min-width: 0; resize: vertical; font: 14px/1.4 var(--f-body); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.ask-out { white-space: pre-wrap; font-size: 14px; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid #2fbf8f; border-radius: 8px; padding: 10px 12px; }

.record { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; }
@media (max-width: 620px) { .record { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.record .rl { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 3px; }
.record b { font-variant-numeric: tabular-nums; }
.record b.over { color: var(--over); }
.record b.under { color: var(--ok); }
.hrs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hrs input { width: 72px; font: 600 14px var(--f-body); font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }

.proj-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 18px; font-size: 13px; color: var(--muted); }
.danger-zone { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.empty { border: 2px dashed var(--line); border-radius: 14px; padding: 48px 24px; text-align: center; }
.empty h2 { font: 800 26px/1.1 var(--f-display); margin: 0 0 6px; }

.spark { position: fixed; z-index: 50; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 14px currentColor, 0 0 6px #fff; }
.floatxp { position: fixed; z-index: 50; pointer-events: none; font: 800 15px/1 var(--f-display); color: var(--ember); animation: rise 1.1s ease-out forwards; }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
body.dragging::after { content: "Suelta el PDF para cargar su hoja de ruta"; position: fixed; inset: 12px; z-index: 60; display: grid; place-items: center; border: 3px dashed var(--ember); border-radius: 18px; background: color-mix(in srgb, var(--bg) 88%, transparent); font: 800 22px var(--f-display); color: var(--ember); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><i aria-hidden="true"></i>Brasa Roadmap</div>
  <div class="top-actions">
    <span id="loadstate" aria-live="polite"></span>
    <span class="select-wrap" hidden><select id="projsel" aria-label="Guía activa"></select></span>
    <label class="btn primary upload" for="file">Cargar PDF<input id="file" type="file" accept="application/pdf,.pdf"></label>
    <button class="btn ghost small" id="sound" aria-pressed="true">Sonido: sí</button>
  </div>
</div>

<div class="layout">
  <aside class="companion" aria-label="Brasa, tu compañero">
    <div class="hearth">
      <div class="hearth-top"><span id="stage">Chispa</span><span id="level">Nivel 1</span></div>
      <canvas id="flame" aria-label="Brasa, la llama que crece con cada tarea" role="img"></canvas>
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <div class="xp">
        <div class="xp-track"><span id="xpbar"></span></div>
        <div class="xp-row"><span id="xptext">0 / 40 de calor</span><span id="nextstage"></span></div>
      </div>
      <div class="trio">
        <div><b id="xptotal">0</b><span>Calor total</span></div>
        <div><b id="streak">0</b><span>Días de racha</span></div>
        <div><b id="combo">—</b><span>Combo</span></div>
      </div>
    </div>
    <div class="panel">
      <h3>Siguiente leña</h3>
      <div id="next"></div>
    </div>
    <div class="panel">
      <h3>De qué está hecha tu llama</h3>
      <div id="stats"></div>
    </div>
    <div class="panel">
      <h3>Últimos 28 días</h3>
      <div id="heat"></div>
      <div class="heat-cap"><span>hace 4 semanas</span><span>hoy</span></div>
      <p class="muted" id="sync" style="font-size:12px;margin:10px 0 0">Guardado en este navegador</p>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script src="src/parser.js"></script>
<script src="src/sample.js"></script>
<script src="src/flame.js"></script>
<script src="src/app.js"></script>
</body>
</html>
